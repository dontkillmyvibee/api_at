name: API Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/performance-qa-engineer-course.git

      - name: Install test server dependencies
        run: pip install -r performance-qa-engineer-course/requirements.txt

      - name: Start a test server
        working-directory: performance-qa-engineer-course
        run: |
          docker build -f Dockerfile.base -t base-service .
          docker compose up -d --build

      - name: Install uv
        run: python -m pip install uv

      - name: Sync dependencies with uv
        working-directory: .
        run: uv sync

      - name: Activate venv and run tests
        working-directory: .
        run: |
          source .venv/bin/activate
          pytest -m api --alluredir=allure-results

      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results
          path: allure-results
          retention-days: 30

  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Allure results artifact
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@1.15
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to Github Page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history