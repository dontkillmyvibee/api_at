name: API Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API.BASE_URL: http://localhost:8003
  API.TIMEOUT: "30"
  STAND_DIR: performance-qa-engineer-course
  STAND_COMPOSE: docker-compose.ci.yaml

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Clone test stand
        run: git clone --depth 1 https://github.com/Nikita-Filonov/performance-qa-engineer-course.git "${STAND_DIR}"

      - name: Build base Docker image
        working-directory: ${{ env.STAND_DIR }}
        run: docker build -f Dockerfile.base -t base-service .

      - name: Start test services
        working-directory: ${{ env.STAND_DIR }}
        run: |
          if [ -f "${STAND_COMPOSE}" ]; then
            docker compose -f "${STAND_COMPOSE}" up -d --build
          else
            docker compose up -d --build
          fi

      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:8003/docs" >/dev/null; then
              echo "Gateway is ready"
              exit 0
            fi
            echo "Waiting for gateway (${i}/60)"
            sleep 5
          done
          echo "Gateway did not become ready"
          docker ps -a
          if [ -f "${STAND_DIR}/${STAND_COMPOSE}" ]; then
            docker compose -f "${STAND_DIR}/${STAND_COMPOSE}" logs --no-color | tail -n 200
          else
            docker compose -f "${STAND_DIR}/docker-compose.yml" logs --no-color | tail -n 200 || true
          fi
          exit 1

      - name: Run API tests
        run: uv run pytest -m api

      - name: Dump stand logs on failure
        if: failure()
        working-directory: ${{ env.STAND_DIR }}
        run: |
          docker ps -a
          if [ -f "${STAND_COMPOSE}" ]; then
            docker compose -f "${STAND_COMPOSE}" logs --no-color | tail -n 400
          else
            docker compose logs --no-color | tail -n 400 || true
          fi

      - name: Stop test services
        if: always()
        working-directory: ${{ env.STAND_DIR }}
        run: |
          if [ -f "${STAND_COMPOSE}" ]; then
            docker compose -f "${STAND_COMPOSE}" down -v
          else
            docker compose down -v || true
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: ignore
          retention-days: 30

  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: ${{ always() && needs.run-tests.result != 'cancelled' && github.event_name != 'pull_request' }}
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download Allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
